name: Generate Snake and Stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Робот генерирует змейку в папочку dist
      - name: Generate Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: m1oky
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Робот в ту же папочку dist качает статистику
      - name: Download Stats SVG
        run: |
          mkdir -p dist
          curl -sSL "https://github-readme-stats.vercel.app/api?username=m1oky&show_icons=true&locale=ru&hide_border=true&bg_color=0d1117&title_color=e10098&text_color=999999&icon_color=00e5ff&rank_icon=circle" -o dist/github-stats.svg

      # Робот сам отправляет ВСЁ содержимое dist в ветку output
      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
