name: Update Profile Stats & Snake

on:
  schedule:
    - cron: "0 */6 * * *" # Автообновление каждые 6 часов
  workflow_dispatch:       # Ручной запуск из вкладки Actions
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Генерация змейки (snk)
      - name: Generate GitHub Contributions Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00ff9d&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      # 2. Генерация точной неоновой карточки статистики через GraphQL API
      - name: Generate Custom Neon Stats SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          mkdir -p dist
          python3 - << 'EOF'
          import os, urllib.request, json

          token = os.environ["GH_TOKEN"]
          user = os.environ["USERNAME"]

          query = """
          query($login: String!) {
            user(login: $login) {
              followers { totalCount }
              repositories(first: 100, ownerAffiliations: OWNER, isFork: false) {
                totalCount
                nodes { stargazerCount }
              }
              contributionsCollection {
                totalCommitContributions
                restrictedContributionsCount
              }
            }
          }
          """

          req = urllib.request.Request(
              "https://api.github.com/graphql",
              data=json.dumps({"query": query, "variables": {"login": user}}).encode("utf-8"),
              headers={
                  "Authorization": f"bearer {token}",
                  "Content-Type": "application/json",
                  "User-Agent": "GitHub-Stats-Generator"
              }
          )

          with urllib.request.urlopen(req) as resp:
              data = json.loads(resp.read().decode("utf-8"))["data"]["user"]

          stars = sum(repo["stargazerCount"] for repo in data["repositories"]["nodes"])
          repos = data["repositories"]["totalCount"]
          followers = data["followers"]["totalCount"]
          commits = (
              data["contributionsCollection"]["totalCommitContributions"]
              + data["contributionsCollection"]["restrictedContributionsCount"]
          )

          # Расчет ранга
          score = commits * 1.5 + stars * 10 + repos * 5 + followers * 3
          if score >= 1500: rank, dash = "S+", 220
          elif score >= 800: rank, dash = "S", 200
          elif score >= 450: rank, dash = "A+", 180
          elif score >= 250: rank, dash = "A", 160
          elif score >= 120: rank, dash = "B+", 135
          else: rank, dash = "B", 110

          svg = f'''<svg width="495" height="195" viewBox="0 0 495 195" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="bg-grad" x1="0" y1="0" x2="495" y2="195" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#0d1117"/>
                <stop offset="100%" stop-color="#141321"/>
              </linearGradient>
              <linearGradient id="border-grad" x1="0" y1="0" x2="495" y2="195" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#ff007f"/>
                <stop offset="50%" stop-color="#7928ca"/>
                <stop offset="100%" stop-color="#00ff9d"/>
              </linearGradient>
              <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="3" result="blur"/>
                <feComposite in="SourceGraphic" in2="blur" operator="over"/>
              </filter>
            </defs>

            <rect x="1" y="1" width="493" height="193" rx="12" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1.5"/>

            <text x="25" y="38" fill="#ff007f" font-family="'Segoe UI', Ubuntu, Sans-Serif" font-size="18" font-weight="700" filter="url(#glow)">
              {user}'s GitHub Stats
            </text>

            <g transform="translate(25, 68)" font-family="'Segoe UI', Ubuntu, Sans-Serif" font-size="14">
              <text x="0" y="0" fill="#a9fef7" font-weight="600">★ Total Stars Earned:</text>
              <text x="195" y="0" fill="#00ff9d" font-weight="700">{stars}</text>

              <text x="0" y="28" fill="#a9fef7" font-weight="600">⚡ Total Commits (1Y):</text>
              <text x="195" y="28" fill="#00ff9d" font-weight="700">{commits}</text>

              <text x="0" y="56" fill="#a9fef7" font-weight="600">📦 Repositories:</text>
              <text x="195" y="56" fill="#00ff9d" font-weight="700">{repos}</text>

              <text x="0" y="84" fill="#a9fef7" font-weight="600">👥 Followers:</text>
              <text x="195" y="84" fill="#00ff9d" font-weight="700">{followers}</text>
            </g>

            <g transform="translate(400, 102)">
              <circle cx="0" cy="0" r="40" stroke="#1f2937" stroke-width="6" fill="none"/>
              <circle cx="0" cy="0" r="40" stroke="#00ff9d" stroke-width="6" fill="none"
                      stroke-dasharray="{dash} 251" stroke-linecap="round" transform="rotate(-90)" filter="url(#glow)"/>
              <text x="0" y="9" text-anchor="middle" fill="#00ff9d" font-family="'Segoe UI', Ubuntu, Sans-Serif"
                    font-size="24" font-weight="800" filter="url(#glow)">{rank}</text>
            </g>
          </svg>'''

          with open("dist/stats.svg", "w", encoding="utf-8") as f:
              f.write(svg)
          EOF

      # 3. Сохранение обоих SVG в ветку output (чтобы не засорять историю main)
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
